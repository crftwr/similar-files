[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "similar-files"
description = "Find identical and similar files, and write each group as a playlist"
readme = "README.md"
license = "MIT"
authors = [{ name = "craftware" }]
requires-python = ">=3.10"
dynamic = ["version"]
# Core: standard library only. Layer 1 (identical files) needs nothing more.
# Pillow (similar images) and numpy (fast video grouping) come with every
# install, on the machines they publish wheels for. Elsewhere (32-bit ARM,
# i686, ppc64le, ...) pip would build them from source, which fails without a
# compiler and takes the install down; there they are left out, and the
# package works without them: identical files, video and audio as ever, video
# grouping in pure Python, images unavailable with a hint. test_dependencies.py
# holds this list.
dependencies = [
    "Pillow>=10; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ARM64' or platform_machine == 'x86'",
    "numpy>=2.0; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ARM64' or platform_machine == 'x86'",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# [image] and [fast] ask for Pillow and numpy whatever the machine. Most
# installs have them already (see dependencies); these are for the machines
# left out above, where someone can build them, and for the names 0.4 used.
image = ["Pillow>=10"]
# wHash (wavelets) only; pHash, dHash and aHash need nothing beyond Pillow.
whash = ["Pillow>=10", "ImageHash>=4.3"]
# Faster video grouping on large collections; without it, the same results in pure Python.
fast = ["numpy>=2.0"]
test = ["pytest"]

[project.scripts]
similar-files = "similar_files.cli:main"

[project.urls]
Homepage = "https://github.com/crftwr/similar-files"
Repository = "https://github.com/crftwr/similar-files"

[tool.setuptools.packages.find]
include = ["similar_files*"]

[tool.setuptools.dynamic]
version = { attr = "similar_files.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
